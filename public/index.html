<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書法班報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  body { margin: 0; }
  a { color: oklch(46% 0.17 29); text-decoration: none; }
  a:hover { color: oklch(38% 0.17 29); text-decoration: underline; }
  input, textarea, select, button { font-family: 'Noto Sans TC', sans-serif; }
  ::selection { background: oklch(46% 0.17 29 / 0.18); }
</style>
</head>
<body>

<div style="background: oklch(97% 0.012 75); min-height: 100vh; font-family: 'Noto Sans TC', sans-serif; color: oklch(20% 0.014 75);">

  <header style="position: sticky; top: 0; z-index: 20; background: oklch(97% 0.012 75 / 0.92); backdrop-filter: blur(6px); border-bottom: 1px solid oklch(85% 0.012 75); padding: 0.9rem 2rem; display: flex; align-items: center; justify-content: space-between;">
    <div style="display: flex; align-items: center; gap: 0.9rem;">
      <div style="width: 44px; height: 44px; background: oklch(46% 0.17 29); color: oklch(97% 0.01 75); display: flex; align-items: center; justify-content: center; font-family: 'Ma Shan Zheng', cursive; font-size: 1.7rem; border-radius: 3px; flex-shrink: 0;">墨</div>
      <div>
        <h1 id="page-title" style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.15rem; letter-spacing: 0.05em;">書法班</h1>
        <p style="margin: 0.1rem 0 0; font-size: 0.68rem; letter-spacing: 0.2em; color: oklch(48% 0.02 75); text-transform: uppercase;">Traditional Chinese Calligraphy</p>
      </div>
    </div>
    <a href="/admin.html" style="font-size: 0.85rem; color: oklch(40% 0.02 75); border: 1px solid oklch(85% 0.012 75); padding: 0.45rem 0.9rem; border-radius: 2px;">管理者登入</a>
  </header>

  <section style="padding: 5.5rem 2rem 4.5rem; text-align: center; position: relative; overflow: hidden;">
    <div style="position: absolute; inset: 0; background: radial-gradient(circle at 20% 20%, oklch(46% 0.17 29 / 0.05), transparent 45%), radial-gradient(circle at 80% 70%, oklch(20% 0.014 75 / 0.05), transparent 50%); pointer-events: none;"></div>
    <h2 style="position: relative; margin: 0; font-family: 'Ma Shan Zheng', cursive; font-size: clamp(3rem, 9vw, 6rem); line-height: 1; color: oklch(20% 0.014 75); font-weight: 400;">翰墨飄香</h2>
    <div style="position: relative; width: 140px; height: 2px; margin: 1.8rem auto; background: linear-gradient(90deg, transparent, oklch(20% 0.014 75 / 0.55), transparent);"></div>
    <p style="position: relative; margin: 0; font-size: 0.95rem; letter-spacing: 0.6em; color: oklch(48% 0.02 75); padding-left: 0.6em;">靜心習字傳承</p>
  </section>

  <main style="max-width: 1040px; margin: 0 auto; padding: 0 2rem 6rem; display: flex; flex-direction: column; gap: 4.5rem;">

    <section>
      <h3 style="font-family: 'Noto Serif TC', serif; font-size: 1.5rem; font-weight: 600; margin: 0 0 1.8rem; display: flex; align-items: center; gap: 0.7rem;">
        <span style="width: 22px; height: 2px; background: oklch(46% 0.17 29); display: inline-block;"></span>
        開放報名中的課程
      </h3>
      <div id="course-cards" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1.4rem;"></div>
      <p id="empty-hint" style="margin: 1rem 0 0; font-size: 0.9rem; color: oklch(48% 0.02 75); display: none;"></p>
    </section>

    <section id="form-section" style="display: none;">
      <h3 style="font-family: 'Noto Serif TC', serif; font-size: 1.5rem; font-weight: 600; margin: 0 0 1.8rem; display: flex; align-items: center; gap: 0.7rem;">
        <span style="width: 22px; height: 2px; background: oklch(46% 0.17 29); display: inline-block;"></span>
        報名表單
      </h3>
      <form id="reg-form" style="border: 1px solid oklch(85% 0.012 75); background: oklch(99% 0.005 75); padding: 2rem; border-radius: 2px; display: flex; flex-direction: column; gap: 1.3rem;">
        <div>
          <label for="course_id" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">選擇課程 *</label>
          <select id="course_id" required style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; color: oklch(20% 0.014 75); box-sizing: border-box;"></select>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.3rem;">
          <div>
            <label for="name" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">姓名 *</label>
            <input type="text" id="name" required style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">
          </div>
          <div>
            <label for="contact_name" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">聯絡人 *</label>
            <input type="text" id="contact_name" required style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">
          </div>
          <div>
            <label for="phone" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">聯絡電話 *</label>
            <input type="text" id="phone" required style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">
          </div>
          <div>
            <label for="email" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">Email</label>
            <input type="email" id="email" style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">
          </div>
        </div>
        <div>
          <label for="note" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.4rem;">備註</label>
          <textarea id="note" rows="3" style="width: 100%; border: 1px solid oklch(85% 0.012 75); background: transparent; padding: 0.6rem; font-size: 0.9rem; border-radius: 2px; box-sizing: border-box; resize: vertical;"></textarea>
        </div>

        <div id="custom-questions"></div>

        <p id="form-error" style="margin: 0; font-size: 0.85rem; color: oklch(46% 0.17 29);"></p>
        <p id="form-success" style="margin: 0; font-size: 0.85rem; color: oklch(42% 0.09 145);"></p>
        <div>
          <button type="submit" id="submit-reg-btn" style="background: oklch(46% 0.17 29); color: oklch(98% 0.01 75); border: none; padding: 0.75rem 2.2rem; font-size: 0.92rem; border-radius: 2px; cursor: pointer; letter-spacing: 0.1em;">送出報名</button>
        </div>
      </form>
    </section>

    <section id="gallery-section" style="display: none;">
      <h3 style="font-family: 'Noto Serif TC', serif; font-size: 1.5rem; font-weight: 600; margin: 0 0 1.8rem; display: flex; align-items: center; gap: 0.7rem;">
        <span style="width: 22px; height: 2px; background: oklch(46% 0.17 29); display: inline-block;"></span>
        教學作品
      </h3>

      <div id="album-list-view">
        <div id="album-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.6rem;"></div>
      </div>

      <div id="album-detail-view" style="display: none;">
        <button type="button" id="album-back-btn" style="background: none; border: 1px solid oklch(85% 0.012 75); padding: 0.5rem 1rem; font-size: 0.85rem; border-radius: 2px; cursor: pointer; margin-bottom: 1.5rem;">&larr; 返回相簿列表</button>
        <h4 id="album-detail-title" style="font-family: 'Noto Serif TC', serif; margin: 0 0 1.2rem; font-size: 1.15rem;"></h4>
        <div id="gallery-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1.2rem;"></div>
      </div>
    </section>

  </main>

  <div id="lightbox" style="display: none; position: fixed; inset: 0; background: oklch(15% 0.01 75 / 0.94); z-index: 1000; align-items: center; justify-content: center; flex-direction: column;">
    <button type="button" id="lightbox-close" aria-label="關閉" style="position: absolute; top: 1.2rem; right: 1.4rem; background: none; border: none; color: oklch(96% 0.01 75); font-size: 2rem; line-height: 1; cursor: pointer;">&times;</button>
    <div style="display: flex; align-items: center; gap: 1.2rem; max-width: 90vw;">
      <button type="button" id="lightbox-prev" aria-label="上一張" style="background: none; border: none; color: oklch(96% 0.01 75); font-size: 2.4rem; cursor: pointer; padding: 0.5rem;">&#8249;</button>
      <div style="max-width: 78vw; max-height: 80vh; text-align: center;">
        <img id="lightbox-img" src="" alt="" style="max-width: 78vw; max-height: 68vh; object-fit: contain; box-shadow: 0 14px 38px oklch(0% 0 0 / 0.4); opacity: 1; transform: translateX(0); transition: opacity 0.35s ease, transform 0.35s ease;">
        <div style="color: oklch(96% 0.01 75); margin-top: 1rem;">
          <strong id="lightbox-title" style="font-family: 'Noto Serif TC', serif; font-size: 1.1rem;"></strong>
          <p id="lightbox-description" style="margin: 0.35rem 0 0; font-size: 0.85rem; color: oklch(85% 0.01 75 / 0.75);"></p>
        </div>
      </div>
      <button type="button" id="lightbox-next" aria-label="下一張" style="background: none; border: none; color: oklch(96% 0.01 75); font-size: 2.4rem; cursor: pointer; padding: 0.5rem;">&#8250;</button>
    </div>
  </div>

</div>

<script>
const courseCards = document.getElementById('course-cards');
const emptyHint = document.getElementById('empty-hint');
const formSection = document.getElementById('form-section');
const courseSelect = document.getElementById('course_id');
const regForm = document.getElementById('reg-form');
const formError = document.getElementById('form-error');
const formSuccess = document.getElementById('form-success');
const customQuestionsWrap = document.getElementById('custom-questions');

const TYPE_LABELS = { text: '文字輸入', number: '數字輸入', single: '單選', multiple: '多選' };
let currentQuestions = [];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

let newBadgeDays = 7;

function newBadgeHtml(createdAt, cornerStyle) {
  if (!newBadgeDays || newBadgeDays <= 0 || !createdAt) return '';
  const created = new Date(createdAt.replace(' ', 'T'));
  const diffDays = (Date.now() - created.getTime()) / (1000 * 60 * 60 * 24);
  if (diffDays < 0 || diffDays > newBadgeDays) return '';
  const style = cornerStyle ? ' style="position:absolute; top:-8px; right:14px; z-index:2;"' : '';
  return `<span class="new-badge"${style}><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>NEW</span>`;
}

function courseStatus(course) {
  const today = todayStr();
  if (today < course.reg_start) return { text: '尚未開始', color: 'oklch(55% 0.02 75)' };
  if (today > course.reg_end) return { text: '已截止', color: 'oklch(55% 0.02 75)' };
  if (course.capacity !== null && course.registered_count >= course.capacity) return { text: '已額滿', color: 'oklch(50% 0.14 55)' };
  return { text: '報名中', color: 'oklch(46% 0.17 29)' };
}

async function loadCourses() {
  const res = await fetch('/api/courses');
  const all = await res.json();
  const open = all.filter(c => courseStatus(c).text === '報名中');

  courseCards.innerHTML = '';
  emptyHint.style.display = open.length === 0 ? 'block' : 'none';
  emptyHint.textContent = all.length === 0
    ? '目前沒有開放報名中的課程，請稍後再回來看看。'
    : '目前沒有課程正在報名中，請參考上方課程列表的報名期間。';
  formSection.style.display = open.length === 0 ? 'none' : 'block';

  courseSelect.innerHTML = open.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  loadQuestionsForCourse(courseSelect.value);

  for (const course of all) {
    const status = courseStatus(course);
    const div = document.createElement('div');
    div.style.cssText = `position: relative; border: 1px solid oklch(85% 0.012 75); border-top: 3px solid ${status.color}; background: oklch(99% 0.005 75); padding: 1.5rem; border-radius: 2px;`;
    div.innerHTML = `
      ${newBadgeHtml(course.created_at, true)}
      <div style="display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.5rem;">
        <strong style="font-family: 'Noto Serif TC', serif; font-size: 1.05rem;">${escapeHtml(course.name)}</strong>
        <span style="font-size: 0.7rem; padding: 0.15rem 0.55rem; border-radius: 10px; color: ${status.color}; border: 1px solid ${status.color};">${status.text}</span>
      </div>
      <p style="margin: 0 0 0.9rem; font-size: 0.88rem; color: oklch(35% 0.014 75); line-height: 1.6;">${escapeHtml(course.description || '')}</p>
      <p style="margin: 0; font-size: 0.78rem; color: oklch(48% 0.02 75); line-height: 1.7;">上課時間：${escapeHtml(course.schedule_text || '未定')}｜名額：${course.capacity ?? '不限'}<br>報名期間：${course.reg_start} ~ ${course.reg_end}</p>
    `;
    courseCards.appendChild(div);
  }
}

function renderQuestion(q) {
  const requiredMark = q.required ? ' *' : '';
  let inputHtml = '';
  if (q.type === 'text') {
    inputHtml = `<input type="text" data-question-id="${q.id}" data-type="text" style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">`;
  } else if (q.type === 'number') {
    inputHtml = `<input type="number" data-question-id="${q.id}" data-type="number" style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 0.95rem; box-sizing: border-box;">`;
  } else if (q.type === 'single') {
    inputHtml = `<div style="display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem;">` + q.options.map(opt => `
      <label style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;">
        <input type="radio" name="q-${q.id}" value="${escapeHtml(opt)}" data-question-id="${q.id}" data-type="single">${escapeHtml(opt)}
      </label>
    `).join('') + `</div>`;
  } else if (q.type === 'multiple') {
    inputHtml = `<div style="display: flex; flex-wrap: wrap; gap: 0.4rem 1.4rem;">` + q.options.map(opt => `
      <label style="display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.9rem;">
        <input type="checkbox" value="${escapeHtml(opt)}" data-question-id="${q.id}" data-type="multiple">${escapeHtml(opt)}
      </label>
    `).join('') + `</div>`;
  }
  return `
    <div>
      <label style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.5rem;">${escapeHtml(q.question_text)}${requiredMark}</label>
      ${inputHtml}
    </div>
  `;
}

async function loadQuestionsForCourse(courseId) {
  if (!courseId) {
    currentQuestions = [];
    customQuestionsWrap.innerHTML = '';
    return;
  }
  const res = await fetch(`/api/courses/${courseId}/questions`);
  currentQuestions = await res.json();
  customQuestionsWrap.innerHTML = currentQuestions.map(renderQuestion).join('');
}

courseSelect.addEventListener('change', () => loadQuestionsForCourse(courseSelect.value));

function collectAnswers() {
  return currentQuestions.map((q) => {
    if (q.type === 'text' || q.type === 'number') {
      const input = customQuestionsWrap.querySelector(`[data-question-id="${q.id}"]`);
      return { question_id: q.id, value: input.value.trim() };
    }
    if (q.type === 'single') {
      const checked = customQuestionsWrap.querySelector(`input[name="q-${q.id}"]:checked`);
      return { question_id: q.id, value: checked ? checked.value : '' };
    }
    const checked = [...customQuestionsWrap.querySelectorAll(`[data-question-id="${q.id}"]:checked`)];
    return { question_id: q.id, value: checked.map(c => c.value) };
  });
}

function validateRequiredAnswers(answers) {
  for (const q of currentQuestions) {
    if (!q.required) continue;
    const a = answers.find(x => x.question_id === q.id);
    const empty = !a || a.value === '' || a.value === undefined || (Array.isArray(a.value) && a.value.length === 0);
    if (empty) return `「${q.question_text}」為必填`;
  }
  return null;
}

const submitRegBtn = document.getElementById('submit-reg-btn');

regForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (submitRegBtn.disabled) return;
  formError.textContent = '';
  formSuccess.textContent = '';

  const answers = collectAnswers();
  const answerError = validateRequiredAnswers(answers);
  if (answerError) {
    formError.textContent = answerError;
    return;
  }

  const payload = {
    course_id: Number(courseSelect.value),
    name: document.getElementById('name').value.trim(),
    contact_name: document.getElementById('contact_name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    note: document.getElementById('note').value.trim(),
    answers,
  };

  submitRegBtn.disabled = true;
  submitRegBtn.textContent = '送出中…';

  try {
    const res = await fetch('/api/registrations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const data = await res.json();
      formError.textContent = data.error || '報名失敗，請稍後再試';
      return;
    }

    regForm.reset();
    formSuccess.textContent = '報名成功！我們已收到您的資料。';
  } catch (err) {
    formError.textContent = '網路異常，請稍後再試一次';
  } finally {
    submitRegBtn.disabled = false;
    submitRegBtn.textContent = '送出報名';
  }
});

fetch('/api/settings/site-info').then(r => r.json()).then((data) => {
  document.getElementById('page-title').textContent = data.site_title;
  document.title = `${data.site_title}報名`;
  newBadgeDays = data.new_badge_days ?? 7;
  loadCourses();
  loadAlbumList();
}).catch(() => {
  loadCourses();
  loadAlbumList();
});

let albums = [];
let galleryItems = [];
let lightboxIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxTitle = document.getElementById('lightbox-title');
const lightboxDescription = document.getElementById('lightbox-description');
const gallerySection = document.getElementById('gallery-section');
const albumListView = document.getElementById('album-list-view');
const albumDetailView = document.getElementById('album-detail-view');
const albumGrid = document.getElementById('album-grid');
const albumDetailTitle = document.getElementById('album-detail-title');
const galleryGrid = document.getElementById('gallery-grid');
const albumBackBtn = document.getElementById('album-back-btn');

function applyLightboxContent() {
  const item = galleryItems[lightboxIndex];
  if (!item) return;
  lightboxImg.src = item.image_url;
  lightboxImg.alt = item.title || '';
  lightboxTitle.textContent = item.title || '';
  lightboxTitle.style.display = item.title ? '' : 'none';
  lightboxDescription.textContent = item.description || '';
  lightboxDescription.style.display = item.description ? '' : 'none';
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    audioCtx = new AudioCtor();
  }
  return audioCtx;
}

// 用 Web Audio API 即時合成翻頁音效（濾波白噪音＋音量包絡），不需外部音檔
function playPageTurnSound() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    const duration = 0.26;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.8;
    filter.frequency.setValueAtTime(2400, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + duration);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.28, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noise.start();
    noise.stop(ctx.currentTime + duration);
  } catch (err) {
    // 忽略音效播放失敗（例如瀏覽器阻擋自動播放）
  }
}

function openLightbox(index) {
  lightboxIndex = index;
  lightboxImg.style.transition = 'none';
  applyLightboxContent();
  lightboxImg.style.opacity = '1';
  lightboxImg.style.transform = 'translateX(0)';
  lightbox.style.display = 'flex';
  requestAnimationFrame(() => {
    lightboxImg.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
  });
}

function closeLightbox() {
  lightbox.style.display = 'none';
}

function goToIndex(newIndex, dir) {
  lightboxIndex = newIndex;
  playPageTurnSound();

  lightboxImg.style.opacity = '0';
  lightboxImg.style.transform = dir === 'next' ? 'translateX(-18px)' : 'translateX(18px)';

  setTimeout(() => {
    applyLightboxContent();
    lightboxImg.style.transform = 'translateX(0)';
    lightboxImg.style.opacity = '1';
  }, 260);
}

function showPrev() {
  goToIndex((lightboxIndex - 1 + galleryItems.length) % galleryItems.length, 'prev');
}

function showNext() {
  goToIndex((lightboxIndex + 1) % galleryItems.length, 'next');
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', showPrev);
document.getElementById('lightbox-next').addEventListener('click', showNext);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (lightbox.style.display === 'none') return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') showPrev();
  if (e.key === 'ArrowRight') showNext();
});

function renderGalleryGrid(items) {
  galleryGrid.innerHTML = items.map((item, index) => `
    <figure class="gallery-thumb" data-index="${index}" style="margin: 0; cursor: pointer;">
      <div style="aspect-ratio: 4 / 5; overflow: hidden; background: oklch(92% 0.01 75);">
        <img src="${item.image_url}" alt="${escapeHtml(item.title || '')}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
      </div>
      <figcaption style="margin-top: 0.6rem; text-align: center;">
        <strong style="font-family: 'Noto Serif TC', serif; font-size: 0.88rem; font-weight: 500;">${escapeHtml(item.title || '')}</strong>
      </figcaption>
    </figure>
  `).join('');
  galleryGrid.querySelectorAll('.gallery-thumb').forEach((el) => {
    el.addEventListener('click', () => openLightbox(Number(el.dataset.index)));
  });
}

async function openAlbum(album) {
  const res = await fetch(`/api/gallery?album_id=${album.id}`);
  galleryItems = await res.json();
  albumDetailTitle.textContent = album.name;
  renderGalleryGrid(galleryItems);
  albumListView.style.display = 'none';
  albumDetailView.style.display = 'block';
}

function backToAlbumList() {
  albumDetailView.style.display = 'none';
  albumListView.style.display = 'block';
}

albumBackBtn.addEventListener('click', backToAlbumList);

function loadAlbumList() {
  fetch('/api/albums').then(r => r.json()).then((data) => {
    albums = data.filter(a => a.cover_url);
    if (!albums.length) return;
    gallerySection.style.display = 'block';
    albumGrid.innerHTML = albums.map((album, index) => `
      <figure class="album-thumb" data-index="${index}" style="margin: 0; cursor: pointer; position: relative;">
        ${newBadgeHtml(album.created_at, true)}
        <div style="aspect-ratio: 4 / 5; overflow: hidden; background: oklch(92% 0.01 75);">
          <img src="${album.cover_url}" alt="${escapeHtml(album.name)}" style="width: 100%; height: 100%; object-fit: cover; display: block;">
        </div>
        <figcaption style="margin-top: 0.7rem; text-align: center;">
          <strong style="font-family: 'Noto Serif TC', serif; font-size: 0.95rem; font-weight: 500;">${escapeHtml(album.name)}</strong>
          <p style="margin: 0.2rem 0 0; font-size: 0.78rem; color: oklch(48% 0.02 75);">${escapeHtml(album.description || '')}</p>
        </figcaption>
      </figure>
    `).join('');
    albumGrid.querySelectorAll('.album-thumb').forEach((el) => {
      el.addEventListener('click', () => openAlbum(albums[Number(el.dataset.index)]));
    });
  });
}
</script>
</body>
</html>
