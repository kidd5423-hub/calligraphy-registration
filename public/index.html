<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書法班報名</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One&family=Noto+Serif+TC:wght@400;600;700&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="header-inner">
    <div class="seal">墨</div>
    <div>
      <h1 id="page-title">書法班</h1>
      <p class="subtitle">TRADITIONAL CHINESE CALLIGRAPHY</p>
    </div>
  </div>
</header>

<div class="hero">
  <h2 class="hero-title">翰墨飄香</h2>
  <div class="ink-divider"></div>
  <p class="hero-tagline">靜　心　習　字　傳　承</p>
</div>

<main>

  <section class="card">
    <h2>開放報名中的課程</h2>
    <div id="course-cards"></div>
    <p class="empty" id="empty-hint" style="display:none;">目前沒有開放報名中的課程，請稍後再回來看看。</p>
  </section>

  <section class="card" id="form-section" style="display:none;">
    <h2>報名表單</h2>
    <form id="reg-form">
      <div class="form-grid">
        <div class="full">
          <label for="course_id">選擇課程 *</label>
          <select id="course_id" required></select>
        </div>
        <div>
          <label for="name">姓名 *</label>
          <input type="text" id="name" required>
        </div>
        <div>
          <label for="contact_name">聯絡人 *</label>
          <input type="text" id="contact_name" required>
        </div>
        <div>
          <label for="phone">聯絡電話 *</label>
          <input type="text" id="phone" required>
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email">
        </div>
        <div class="full">
          <label for="note">備註</label>
          <textarea id="note"></textarea>
        </div>
      </div>
      <div id="custom-questions"></div>
      <p class="hint" id="form-error" style="color:#b3261e;"></p>
      <p class="hint" id="form-success" style="color:#274e13;"></p>
      <div class="actions" style="margin-top:0.8rem;">
        <button type="submit" class="primary" id="submit-reg-btn">送出報名</button>
      </div>
    </form>
  </section>

  <section class="card" id="gallery-section" style="display:none;">
    <h2>教學作品</h2>
    <div id="album-list-view">
      <div id="album-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:1rem;"></div>
    </div>
    <div id="album-detail-view" style="display:none;">
      <button type="button" id="album-back-btn" class="secondary" style="margin-bottom:1rem;">&larr; 返回相簿列表</button>
      <h3 id="album-detail-title" style="margin:0 0 1rem;"></h3>
      <div id="gallery-grid" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:1rem;"></div>
    </div>
  </section>

</main>

<div id="lightbox" style="display:none; position:fixed; inset:0; background:rgba(20,18,16,0.9); z-index:1000; align-items:center; justify-content:center; flex-direction:column;">
  <button type="button" id="lightbox-close" aria-label="關閉" style="position:absolute; top:1rem; right:1.2rem; background:none; border:none; color:#f3ecda; font-size:2rem; line-height:1; cursor:pointer;">&times;</button>
  <div style="display:flex; align-items:center; gap:1rem; max-width:90vw;">
    <button type="button" id="lightbox-prev" aria-label="上一張" style="background:none; border:none; color:#f3ecda; font-size:2.5rem; line-height:1; cursor:pointer; padding:0.5rem;">&#8249;</button>
    <div style="max-width:80vw; max-height:80vh; text-align:center; perspective:1400px;">
      <img id="lightbox-img" src="" alt="" style="max-width:80vw; max-height:70vh; object-fit:contain; border-radius:3px; opacity:1; transform:rotateY(0deg); transform-style:preserve-3d; backface-visibility:hidden; box-shadow:0 12px 34px rgba(0,0,0,0.45); transition:opacity 0.45s ease, transform 0.45s cubic-bezier(0.45,0.05,0.35,1);">
      <div style="color:#f3ecda; margin-top:0.8rem;">
        <strong id="lightbox-title" style="font-family:'Klee One', serif; font-size:1.1rem;"></strong>
        <p id="lightbox-description" class="hint" style="color:rgba(243,236,218,0.7); margin:0.3rem 0 0;"></p>
      </div>
    </div>
    <button type="button" id="lightbox-next" aria-label="下一張" style="background:none; border:none; color:#f3ecda; font-size:2.5rem; line-height:1; cursor:pointer; padding:0.5rem;">&#8250;</button>
  </div>
</div>

<script>
const courseCards = document.getElementById('course-cards');
const emptyHint = document.getElementById('empty-hint');
const formSection = document.getElementById('form-section');
const courseSelect = document.getElementById('course_id');
const regForm = document.getElementById('reg-form');
const formError = document.getElementById('form-error');
const formSuccess = document.getElementById('form-success');
const customQuestionsWrap = document.getElementById('custom-questions');

const TYPE_LABELS = { text: '文字輸入', number: '數字輸入', single: '單選', multiple: '多選' };
let currentQuestions = [];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function courseStatus(course) {
  const today = todayStr();
  if (today < course.reg_start) return { text: '尚未開始', cls: 'status-upcoming' };
  if (today > course.reg_end) return { text: '已截止', cls: 'status-closed' };
  if (course.capacity !== null && course.registered_count >= course.capacity) {
    return { text: '已額滿', cls: 'status-full' };
  }
  return { text: '報名中', cls: 'status-open' };
}

async function loadCourses() {
  const res = await fetch('/api/courses');
  const all = await res.json();
  const open = all.filter(c => courseStatus(c).cls === 'status-open');

  courseCards.innerHTML = '';
  emptyHint.style.display = open.length === 0 ? 'block' : 'none';
  emptyHint.textContent = all.length === 0
    ? '目前沒有開放報名中的課程，請稍後再回來看看。'
    : '目前沒有課程正在報名中，請參考下方課程列表的報名期間。';
  formSection.style.display = open.length === 0 ? 'none' : 'block';

  courseSelect.innerHTML = open.map(c => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('');
  loadQuestionsForCourse(courseSelect.value);

  for (const course of all) {
    const status = courseStatus(course);
    const div = document.createElement('div');
    div.className = 'course-item';
    div.innerHTML = `
      <strong>${escapeHtml(course.name)}</strong>
      <span class="status-badge ${status.cls}" style="margin-left:0.5rem;">${status.text}</span>
      <p style="margin:0.4rem 0; font-size:0.9rem;">${escapeHtml(course.description || '')}</p>
      <p class="hint" style="margin:0;">
        上課時間：${escapeHtml(course.schedule_text || '未定')}｜
        名額：${course.capacity ?? '不限'}｜
        報名期間：${course.reg_start} ~ ${course.reg_end}
      </p>
    `;
    courseCards.appendChild(div);
  }
}

function renderQuestion(q) {
  const requiredMark = q.required ? ' *' : '';
  let inputHtml = '';
  if (q.type === 'text') {
    inputHtml = `<input type="text" data-question-id="${q.id}" data-type="text">`;
  } else if (q.type === 'number') {
    inputHtml = `<input type="number" data-question-id="${q.id}" data-type="number">`;
  } else if (q.type === 'single') {
    inputHtml = q.options.map(opt => `
      <label style="display:inline-flex; align-items:center; gap:0.3rem; margin-right:1rem; font-weight:normal;">
        <input type="radio" name="q-${q.id}" value="${escapeHtml(opt)}" data-question-id="${q.id}" data-type="single">
        ${escapeHtml(opt)}
      </label>
    `).join('');
  } else if (q.type === 'multiple') {
    inputHtml = q.options.map(opt => `
      <label style="display:inline-flex; align-items:center; gap:0.3rem; margin-right:1rem; font-weight:normal;">
        <input type="checkbox" value="${escapeHtml(opt)}" data-question-id="${q.id}" data-type="multiple">
        ${escapeHtml(opt)}
      </label>
    `).join('');
  }
  return `
    <div class="full" style="margin-bottom:0.8rem;">
      <label>${escapeHtml(q.question_text)}${requiredMark}</label>
      ${inputHtml}
    </div>
  `;
}

async function loadQuestionsForCourse(courseId) {
  if (!courseId) {
    currentQuestions = [];
    customQuestionsWrap.innerHTML = '';
    return;
  }
  const res = await fetch(`/api/courses/${courseId}/questions`);
  currentQuestions = await res.json();
  customQuestionsWrap.innerHTML = currentQuestions.map(renderQuestion).join('');
}

courseSelect.addEventListener('change', () => loadQuestionsForCourse(courseSelect.value));

function collectAnswers() {
  return currentQuestions.map((q) => {
    if (q.type === 'text' || q.type === 'number') {
      const input = customQuestionsWrap.querySelector(`[data-question-id="${q.id}"]`);
      return { question_id: q.id, value: input.value.trim() };
    }
    if (q.type === 'single') {
      const checked = customQuestionsWrap.querySelector(`input[name="q-${q.id}"]:checked`);
      return { question_id: q.id, value: checked ? checked.value : '' };
    }
    const checked = [...customQuestionsWrap.querySelectorAll(`[data-question-id="${q.id}"]:checked`)];
    return { question_id: q.id, value: checked.map(c => c.value) };
  });
}

function validateRequiredAnswers(answers) {
  for (const q of currentQuestions) {
    if (!q.required) continue;
    const a = answers.find(x => x.question_id === q.id);
    const empty = !a || a.value === '' || a.value === undefined || (Array.isArray(a.value) && a.value.length === 0);
    if (empty) return `「${q.question_text}」為必填`;
  }
  return null;
}

const submitRegBtn = document.getElementById('submit-reg-btn');

regForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (submitRegBtn.disabled) return;
  formError.textContent = '';
  formSuccess.textContent = '';

  const answers = collectAnswers();
  const answerError = validateRequiredAnswers(answers);
  if (answerError) {
    formError.textContent = answerError;
    return;
  }

  const payload = {
    course_id: Number(courseSelect.value),
    name: document.getElementById('name').value.trim(),
    contact_name: document.getElementById('contact_name').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    email: document.getElementById('email').value.trim(),
    note: document.getElementById('note').value.trim(),
    answers,
  };

  submitRegBtn.disabled = true;
  submitRegBtn.textContent = '送出中…';

  try {
    const res = await fetch('/api/registrations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) {
      const data = await res.json();
      formError.textContent = data.error || '報名失敗，請稍後再試';
      return;
    }

    regForm.reset();
    formSuccess.textContent = '報名成功！我們已收到您的資料。';
  } catch (err) {
    formError.textContent = '網路異常，請稍後再試一次';
  } finally {
    submitRegBtn.disabled = false;
    submitRegBtn.textContent = '送出報名';
  }
});

loadCourses();

fetch('/api/settings/site-info').then(r => r.json()).then((data) => {
  document.getElementById('page-title').textContent = data.site_title;
  document.title = `${data.site_title}報名`;
});

let albums = [];
let galleryItems = [];
let lightboxIndex = 0;

const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
const lightboxTitle = document.getElementById('lightbox-title');
const lightboxDescription = document.getElementById('lightbox-description');
const gallerySection = document.getElementById('gallery-section');
const albumListView = document.getElementById('album-list-view');
const albumDetailView = document.getElementById('album-detail-view');
const albumGrid = document.getElementById('album-grid');
const albumDetailTitle = document.getElementById('album-detail-title');
const galleryGrid = document.getElementById('gallery-grid');
const albumBackBtn = document.getElementById('album-back-btn');

function applyLightboxContent() {
  const item = galleryItems[lightboxIndex];
  if (!item) return;
  lightboxImg.src = item.image_url;
  lightboxImg.alt = item.title || '';
  lightboxTitle.textContent = item.title || '';
  lightboxTitle.style.display = item.title ? '' : 'none';
  lightboxDescription.textContent = item.description || '';
  lightboxDescription.style.display = item.description ? '' : 'none';
}

let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    const AudioCtor = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtor) return null;
    audioCtx = new AudioCtor();
  }
  return audioCtx;
}

// 用 Web Audio API 即時合成翻頁音效（濾波白噪音＋音量包絡），不需外部音檔
function playPageTurnSound() {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    if (ctx.state === 'suspended') ctx.resume();

    const duration = 0.26;
    const bufferSize = Math.floor(ctx.sampleRate * duration);
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }

    const noise = ctx.createBufferSource();
    noise.buffer = buffer;

    const filter = ctx.createBiquadFilter();
    filter.type = 'bandpass';
    filter.Q.value = 0.8;
    filter.frequency.setValueAtTime(2400, ctx.currentTime);
    filter.frequency.exponentialRampToValueAtTime(500, ctx.currentTime + duration);

    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.0001, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.32, ctx.currentTime + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);

    noise.connect(filter);
    filter.connect(gain);
    gain.connect(ctx.destination);

    noise.start();
    noise.stop(ctx.currentTime + duration);
  } catch (err) {
    // 忽略音效播放失敗（例如瀏覽器阻擋自動播放）
  }
}

function openLightbox(index) {
  lightboxIndex = index;
  lightboxImg.style.transition = 'none';
  applyLightboxContent();
  lightboxImg.style.opacity = '1';
  lightboxImg.style.transformOrigin = 'center center';
  lightboxImg.style.transform = 'rotateY(0deg)';
  lightbox.style.display = 'flex';
  requestAnimationFrame(() => {
    lightboxImg.style.transition = 'opacity 0.45s ease, transform 0.45s cubic-bezier(0.45,0.05,0.35,1)';
  });
}

function closeLightbox() {
  lightbox.style.display = 'none';
}

function goToIndex(newIndex, dir) {
  lightboxIndex = newIndex;
  playPageTurnSound();

  // 翻頁效果：目前照片先以左/右邊緣為軸翻出去
  lightboxImg.style.transformOrigin = dir === 'next' ? 'left center' : 'right center';
  lightboxImg.style.opacity = '0.15';
  lightboxImg.style.transform = dir === 'next' ? 'rotateY(-100deg)' : 'rotateY(100deg)';

  setTimeout(() => {
    applyLightboxContent();
    // 換成新照片，從另一側邊緣翻入
    lightboxImg.style.transformOrigin = dir === 'next' ? 'right center' : 'left center';
    lightboxImg.style.transform = dir === 'next' ? 'rotateY(80deg)' : 'rotateY(-80deg)';
    requestAnimationFrame(() => {
      lightboxImg.style.opacity = '1';
      lightboxImg.style.transform = 'rotateY(0deg)';
    });
  }, 230);
}

function showPrev() {
  goToIndex((lightboxIndex - 1 + galleryItems.length) % galleryItems.length, 'prev');
}

function showNext() {
  goToIndex((lightboxIndex + 1) % galleryItems.length, 'next');
}

document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
document.getElementById('lightbox-prev').addEventListener('click', showPrev);
document.getElementById('lightbox-next').addEventListener('click', showNext);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
document.addEventListener('keydown', (e) => {
  if (lightbox.style.display === 'none') return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') showPrev();
  if (e.key === 'ArrowRight') showNext();
});

function renderGalleryGrid(items) {
  galleryGrid.innerHTML = items.map((item, index) => `
    <figure class="gallery-thumb" data-index="${index}" style="margin:0; border:1px solid var(--border); border-radius:3px; overflow:hidden; background:#fffdf7; cursor:pointer;">
      <img src="${item.image_url}" alt="${escapeHtml(item.title || '')}" style="width:100%; height:160px; object-fit:cover; display:block;">
      ${item.title || item.description ? `
        <figcaption style="padding:0.5rem;">
          ${item.title ? `<strong style="font-size:0.9rem;">${escapeHtml(item.title)}</strong>` : ''}
          ${item.description ? `<p class="hint" style="margin:0.2rem 0 0;">${escapeHtml(item.description)}</p>` : ''}
        </figcaption>
      ` : ''}
    </figure>
  `).join('');
  galleryGrid.querySelectorAll('.gallery-thumb').forEach((el) => {
    el.addEventListener('click', () => openLightbox(Number(el.dataset.index)));
  });
}

async function openAlbum(album) {
  const res = await fetch(`/api/gallery?album_id=${album.id}`);
  galleryItems = await res.json();
  albumDetailTitle.textContent = album.name;
  renderGalleryGrid(galleryItems);
  albumListView.style.display = 'none';
  albumDetailView.style.display = 'block';
}

function backToAlbumList() {
  albumDetailView.style.display = 'none';
  albumListView.style.display = 'block';
}

albumBackBtn.addEventListener('click', backToAlbumList);

fetch('/api/albums').then(r => r.json()).then((data) => {
  albums = data.filter(a => a.cover_url);
  if (!albums.length) return;
  gallerySection.style.display = 'block';
  albumGrid.innerHTML = albums.map((album, index) => `
    <figure class="album-thumb" data-index="${index}" style="margin:0; border:1px solid var(--border); border-radius:3px; overflow:hidden; background:#fffdf7; cursor:pointer;">
      <img src="${album.cover_url}" alt="${escapeHtml(album.name)}" style="width:100%; height:160px; object-fit:cover; display:block;">
      <figcaption style="padding:0.5rem;">
        <strong style="font-size:0.9rem;">${escapeHtml(album.name)}</strong>
        ${album.description ? `<p class="hint" style="margin:0.2rem 0 0;">${escapeHtml(album.description)}</p>` : ''}
      </figcaption>
    </figure>
  `).join('');
  albumGrid.querySelectorAll('.album-thumb').forEach((el) => {
    el.addEventListener('click', () => openAlbum(albums[Number(el.dataset.index)]));
  });
});
</script>
</body>
</html>
