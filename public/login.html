<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理者登入</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body { margin: 0; }
  a { color: oklch(46% 0.17 29); text-decoration: none; }
  a:hover { color: oklch(38% 0.17 29); text-decoration: underline; }
  input, button { font-family: 'Noto Sans TC', sans-serif; }
</style>
</head>
<body>

<div style="background: oklch(97% 0.012 75); min-height: 100vh; font-family: 'Noto Sans TC', sans-serif; color: oklch(20% 0.014 75); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; box-sizing: border-box; position: relative; overflow: hidden;">
  <div style="position: absolute; inset: 0; background: radial-gradient(circle at 15% 15%, oklch(46% 0.17 29 / 0.05), transparent 45%), radial-gradient(circle at 85% 85%, oklch(20% 0.014 75 / 0.05), transparent 50%); pointer-events: none;"></div>

  <div style="position: relative; display: flex; flex-direction: column; align-items: center; margin-bottom: 2.4rem;">
    <div style="width: 56px; height: 56px; background: oklch(46% 0.17 29); color: oklch(97% 0.01 75); display: flex; align-items: center; justify-content: center; font-family: 'Ma Shan Zheng', cursive; font-size: 2.1rem; border-radius: 3px; margin-bottom: 1rem;">墨</div>
    <h1 id="site-title" style="margin: 0; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 1.1rem; letter-spacing: 0.05em;">書法班報名系統</h1>
    <p style="margin: 0.2rem 0 0; font-size: 0.68rem; letter-spacing: 0.2em; color: oklch(48% 0.02 75); text-transform: uppercase;">Admin Login</p>
  </div>

  <form id="login-form" style="position: relative; width: 100%; max-width: 340px; border: 1px solid oklch(85% 0.012 75); background: oklch(99% 0.005 75); padding: 2.2rem 2rem; border-radius: 2px; display: flex; flex-direction: column; gap: 1.2rem; box-sizing: border-box;">
    <h2 style="margin: 0 0 0.2rem; font-family: 'Noto Serif TC', serif; font-size: 1.15rem; font-weight: 600; text-align: center;">管理者登入</h2>
    <div>
      <label for="password" style="display: block; font-size: 0.8rem; color: oklch(48% 0.02 75); margin-bottom: 0.5rem;">密碼</label>
      <input type="password" id="password" required autofocus style="width: 100%; border: none; border-bottom: 1px solid oklch(75% 0.012 75); background: transparent; padding: 0.5rem 0; font-size: 1rem; box-sizing: border-box;">
    </div>
    <p id="login-error" style="margin: 0; font-size: 0.85rem; color: oklch(46% 0.17 29); min-height: 1.1em;"></p>
    <button type="submit" style="background: oklch(46% 0.17 29); color: oklch(98% 0.01 75); border: none; padding: 0.75rem; font-size: 0.95rem; border-radius: 2px; cursor: pointer; letter-spacing: 0.15em;">登入</button>
  </form>
</div>

<script>
const form = document.getElementById('login-form');
const passwordField = document.getElementById('password');
const loginError = document.getElementById('login-error');

fetch('/api/settings/site-info').then(r => r.json()).then((data) => {
  document.getElementById('site-title').textContent = data.site_title;
  document.title = `管理者登入｜${data.site_title}`;
});

const params = new URLSearchParams(location.search);
const redirectTo = params.get('redirect') || '/admin.html';

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  loginError.textContent = '';

  const res = await fetch('/api/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ password: passwordField.value }),
  });

  if (!res.ok) {
    const data = await res.json();
    loginError.textContent = data.error || '登入失敗';
    return;
  }

  location.href = redirectTo;
});
</script>
</body>
</html>
